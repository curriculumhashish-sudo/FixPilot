---
# 集群内 Ollama 用于 no-API-key 智能体 e2e（参见 TESTING.md）。 可跨集群移植：Agent Server 通过服务 DNS / ClusterIP 到达它，因此不涉及主机网络。 模型位于 emptyDir 中，因此如果 pod 重新启动，则再次 `ollama pull`。 CPU-仅； 调整集群的节点/模型大小。
#
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ollama
    namespace: default
spec:
    replicas: 1
    selector:
        matchLabels: {app: ollama}
    template:
        metadata:
            labels: {app: ollama}
        spec:
            containers:
                - name: ollama
                  image: ollama/ollama:latest
                  ports: [containerPort: 11434]
                  env:
                      - {name: OLLAMA_HOST, value: 0.0.0.0:11434}
                      - {name: OLLAMA_KEEP_ALIVE, value: '-1'}
                  readinessProbe:
                      httpGet: {path: /api/tags, port: 11434}
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  resources:
                      requests: {cpu: '1', memory: 4Gi}
                      limits: {memory: 8Gi}
                  volumeMounts:
                      - {name: models, mountPath: /root/.ollama}
            volumes:
                - name: models
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: ollama
    namespace: default
spec:
    selector: {app: ollama}
    ports:
        - {port: 11434, targetPort: 11434}
