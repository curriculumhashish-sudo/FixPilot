---
# SandboxTemplate 运行 OpenHands Agent Server。
#
# Agent Server张图片是一个独立的服务器，它监听在端口上，并且与HTTP API DockerWorkspace / APIRemoteWorkspace 连接，因此它直接进入一个智能体-沙盒 Pod。 /health 上的就绪探针 Agent Server 只有在实际上接受请求时，才会使 Sandbox 达到就绪状态。
#
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
    name: openhands-agent-server
    namespace: default
spec:
    # 控制器管理的 NetworkPolicy（默认）允许公共出口，但阻止私有范围，因此沙箱无法到达集群内或主机上 LLM。 不要将模板切换到 `networkPolicyManagement: Unmanaged`，而是将其保持托管并仅允许智能体需要的内容，e.g。：
    #
    # networkPolicy:
    #     出口：
    #         # DNS
    #         - 至：
    #               - namespaceSelector:
    #                     matchLabels: {kubernetes.io/metadata.name: kube 系统}
    #           端口：[{协议：UDP，端口：53}，{协议：TCP，端口：53}]
    #         # 集群内 LLM（根据您的部署调整选择器/命名空间/端口）
    #         - 至：
    #               - podSelector:
    #                     matchLabels：{应用程序：ollama}
    #           端口：[{协议：TCP，端口：11434}]
    #         # 托管 LLM APIs HTTPS
    #         - 端口：[{协议：TCP，端口：443}]
    #
    # 持久卷安装在 /workspace 处，因此工作区（以及智能体写入的任何内容）可以在挂起/恢复周期中幸存下来。
    #
    volumeClaimTemplates:
        - metadata:
              name: workspace-volume
          spec:
              accessModes: [ReadWriteOnce]
              resources:
                  requests:
                      storage: 5Gi
    podTemplate:
        spec:
            # runtimeClassName: gvisor # 取消注释以强隔离不受信任的代码
            securityContext:
                # 智能体-服务器镜像以 uid/gid 10001 运行； 使 PVC 组可写。
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
            containers:
                - name: agent-server
                  image: ghcr.io/openhands/agent-server:1.42.1-python
                  args: [--host, 0.0.0.0, --port, '8000']
                  workingDir: /workspace
                  ports:
                      - containerPort: 8000
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8000
                      initialDelaySeconds: 3
                      periodSeconds: 3
                      failureThreshold: 40
                  resources:
                      requests:
                          cpu: 250m
                          memory: 512Mi
                      limits:
                          cpu: '2'
                          memory: 2Gi
                  volumeMounts:
                      - name: workspace-volume
                        mountPath: /workspace
