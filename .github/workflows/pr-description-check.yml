---
name: PR Description Check

# 使用 pull_request_target 以便可以检查分叉 PR 描述，但只能从下面的基本分支签出运行受信任的验证代码。
#

on:
    pull_request_target:
        types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: read
    issues: read

jobs:
    validate-pr-description:
        name: Validate PR description
        # 草案PR可能仍有不完整的描述； 审核开始时进行验证。 发布和工件清理 PR 由可信工作流程生成，无需标准的人工创作 PR 模板。
        #
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !(github.event.pull_request.head.repo.full_name == github.repository &&
            (startsWith(github.event.pull_request.head.ref, 'rel-') ||
            (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.ref == 'automation/remove-pr-artifacts')))
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout trusted workflow scripts
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Validate HUMAN note, PR template, and linked-issue readiness
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python .github/scripts/check_pr_description.py
