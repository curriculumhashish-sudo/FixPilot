---
# 用于自动依赖更新的 Dependabot 配置
# 请参阅： https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # GitHub 行动
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(deps)

    # Python (uv) — 工作区支持已在 dependentabot-core v0.374.0 中提供（ https://github.com/dependabot/dependabot-core/pull/14627,  2026 年 5 月）。
    #
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore(deps)

    - package-ecosystem: npm
      directory: /clients/typescript
      cooldown:
          default-days: 7
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(deps)
