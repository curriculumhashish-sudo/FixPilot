[project]
name = "openhands-agent-server"
version = "1.58.2"
description = "OpenHands Agent Server - REST/WebSocket interface for OpenHands AI Agent"

requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.13",
  "certifi>=2026.10.19",  # eMudhra CA 不信任：GHSA-6q48-6c7w-9gw2
  "docker>=7.1,<8",
  "fastapi>=0.104",
  "openhands-sdk",
  "openhands-tools",
  "openai>=2.33.0,<3",
  "pydantic>=2.13.5",
  "sqlalchemy>=2",
  "uvicorn>=0.54.0",
  "websockets>=12",
  "wsproto>=1.2.0",
]

[project.optional-dependencies]
# 产品分析导出器。 有意可选：核心服务器和每个库/无头消费者必须能够在导入路径上没有供应商分析 SDK 的情况下运行。 受限于uv.lock中已解决的主要问题，因此安装额外的内容不会强制解决程序冲突。
#
posthog = ["posthog>=7.60.0,<8"]

[project.urls]
Source = "https://github.com/OpenHands/software-agent-sdk"
Homepage = "https://github.com/OpenHands/software-agent-sdk"
Documentation = "https://docs.openhands.dev/sdk"
"Bug Tracker" = "https://github.com/OpenHands/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.agent_server*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
# 包括Docker相关的文件和VSCode扩展
"openhands.agent_server" = [
  "docker/Dockerfile",
  "docker/wallpaper.svg",
  "vscode_extensions/**/*.json",
  "vscode_extensions/**/*.js",
]

[project.scripts]
agent-server = "openhands.agent_server.__main__:main"
