# uv工作区配置
[tool.uv.workspace]
members = ["openhands-sdk", "openhands-tools", "openhands-workspace", "openhands-agent-server"]

# 安全性：应用工作区范围的依赖关系约束检查。
[tool.uv]
exclude-newer = "7 days"  # 避免在过去 7 天内上传的包。
exclude-newer-package = { litellm = "2026-07-20T00:00:00Z", lmnr = "2026-08-23T00:00:00Z", certifi = "2026-10-21T00:00:00Z", pip = "2026-10-21T00:00:00Z" }  # lmnr：允许在 7 天约束检查内修复 0.7.60 流式传输-token； certifi/pip：允许 eMudhra CA 不信任修复 (GHSA-6q48-6c7w-9gw2) 通过 7 天约束检查
constraint-dependencies = [
    "nodejs-wheel-binaries>=24,<25",
    "starlette>=0.49.1",
    "aiohttp>=3.13.3",
    "urllib3>=2.8.0",
    "protobuf>=6.33.5",
    "pillow>=12.3.0",
    "orjson>=3.11.7",
    "rich>=14.3.3", # 版本 14.3.2 本质上存在一个拒绝服务漏洞，如  https://github.com/Textualize/rich/issues/3958  中所述
    "lupa>=2.8",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",  # 49.0.0 掉落了 x86_64 macOS 轮子； release-binaries.yml 仍然基于 macos-15-intel 构建
    "litellm==1.93.0",  # 工作区锁请求的 LiteLLM 升级的目标
    "anyio>=4.14.2",
    "pyjwt>=2.14.0",
]

# 工作区仓库内依赖关系的来源
[tool.uv.sources]
openhands-sdk = { workspace = true }
openhands-tools = { workspace = true }
openhands-workspace = { workspace = true }
openhands-agent-server = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyright[nodejs]>=1.1.405",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.10",
    "pycodestyle>=2.12.0",
    "pytest-asyncio>=1.1.0",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.6.0",
    "tabulate>=0.9.0",
    "pyinstaller>=6.22.2",
    "streamlit>=1.49.1",
    "pytest-timeout>=2.4.0",
    "griffe[pypi]>=2.3.0",
]

# Ruff 配置
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes（包括 F841：未使用的变量）
    "I",    # isort
    "UP",   # py升级
    "ARG",  # flake8-未使用的参数
]
# 执行捕获可变默认值和相关陷阱的规则
# - B006：可变参数默认值
# - B008：默认参数中的函数调用
# - B039：可变上下文变量默认值
# - RUF012：可变类默认值
extend-select = ["B006", "B008", "B039", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# 测试文件通常具有未使用的参数（测试夹具、模拟对象、接口实现）
"tests/**/*.py" = ["ARG"]


# flake8-bugbear 规则的白名单安全默认调用（e.g., FastAPI 取决于）
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
]

[tool.ruff.lint.isort]
known-first-party = ["openhands"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

# pytest 配置
[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not stress and not acp_live and not docker_live'"
asyncio_mode = "auto"
markers = [
    "stress: stress / scale tests, deselected by default. Run with `pytest -m stress` (see tests/agent_server/stress/__init__.py for details).",
    "acp_live: live ACP conformance/pin-installability tests that launch real npx subprocesses and hit the npm registry, deselected by default. Run with `pytest -m acp_live` (see tests/sdk/agent/test_acp_conformance.py).",
    "docker_live: scenarios against a real Docker daemon and agent-server image, deselected by default. Run with `pytest -m docker_live` (see tests/agent_server/docker_runtime/STORAGE_SCENARIO.md).",
]

# Pyright 配置文件 PEP 420 命名空间此包是必需的 VSCode 正确解决跨多个包的导入问题单体仓库
#
[tool.pyright]
include = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server",
    "examples",
    "tests",
    "scripts"
]
extraPaths = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server"
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
useLibraryCodeForTypes = true
typeCheckingMode = "standard"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
