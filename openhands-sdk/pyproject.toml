[project]
name = "openhands-sdk"
version = "1.58.2"
description = "OpenHands SDK - Core functionality for building AI agents"

requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13.0",  # 0.11.0 重新排序 prompt() 参数，破坏了客户端 (#4830)
    "certifi>=2026.10.19",  # eMudhra CA 不信任：GHSA-6q48-6c7w-9gw2
    "deprecation>=2.1.0",
    "fakeredis[lua]>=2.32.1",  # doket/fastmcp 后台任务的显式依赖
    # 3.2.0 读回存储的绝对OAuthtoken过期时间； 4.x 需要 MCP>=2，浏览器使用 0.11.x 无法使用 (#5152)
    #
    "fastmcp>=3.2.0,<4",
    "filelock>=3.20.1",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.23.0",
    "joserfc>=1.7.5",
    "litellm>=1.93.0,<1.106",  # 1.106+ 需要 MCP>=2（在 MCP 1.x 上导入失败）； 参见#6088
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "python-json-logger>=3.3.0",
    "tenacity>=9.1.2",
    "websockets>=12",
    "lmnr>=0.7.60,<0.8.0",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.urls]
Source = "https://github.com/OpenHands/software-agent-sdk"
Homepage = "https://github.com/OpenHands/software-agent-sdk"
Documentation = "https://docs.openhands.dev/sdk"
"Bug Tracker" = "https://github.com/OpenHands/software-agent-sdk/issues"

[project.optional-dependencies]
boto3 = ["boto3>=1.35.0"]
toolshield = ["toolshield>=0.1.3,<0.2"]
vertex = ["google-cloud-aiplatform>=2.1.3"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.sdk*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.j2", "schemas/*.json"]
